<svg xmlns="http://www.w3.org/2000/svg" width="506" height="162" viewBox="0 0 506 162" role="img" aria-label="More about me at dirga.dev Oh, and I use Arch btw 😏 Have a great Saturday!">
<style>
text { font: 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
.msg { opacity: 0; animation: pop .35s cubic-bezier(.2,.9,.3,1.3) forwards; }
@keyframes pop { from { opacity: 0; transform: scale(.85) translateY(8px); } to { opacity: 1; transform: none; } }
.bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .8s cubic-bezier(.3,.8,.3,1) forwards; }
@keyframes grow { to { transform: scaleX(1); } }
.c { transform-box: fill-box; transform-origin: center; opacity: 0; animation: cell .5s ease-out both; }
.g { animation: cell .5s ease-out both, flash .65s ease-out both; }
@keyframes cell { 0% { opacity: 0; transform: scale(.2); } 60% { opacity: 1; transform: scale(1.15); } 100% { opacity: 1; transform: scale(1); } }
@keyframes flash { 0%, 45% { filter: brightness(2.4); } 100% { filter: brightness(1); } }
@media (prefers-reduced-motion: reduce) { .msg, .c { animation: none; opacity: 1; } .bar { animation: none; transform: none; } }
</style>
<g class="msg" style="animation-delay:2.55s;transform-origin:28px 46px"><rect width="235" height="44" x="28" y="2" rx="18" fill="#3a3a3c"/><text fill="#f0f6fc"><tspan x="44" y="30">More about me at <tspan fill="#4493f8">dirga.dev</tspan></tspan></text></g><g class="msg" style="animation-delay:3.00s;transform-origin:28px 98px"><rect width="230" height="44" x="28" y="54" rx="18" fill="#3a3a3c"/><text fill="#f0f6fc"><tspan x="44" y="82">Oh, and I use Arch btw 😏</tspan></text></g><g class="msg" style="animation-delay:3.45s;transform-origin:28px 150px"><rect width="206" height="44" x="28" y="106" rx="18" fill="#3a3a3c"/><text fill="#f0f6fc"><tspan x="44" y="134">Have a great Saturday!</tspan></text></g>
</svg>