name: Contrib Graph

"on":
  schedule:
    - cron: "0 * * * *" # every 1 hour
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Scrape real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: dirgaydtm
        run: bun scripts/fetch_contributions.ts

      - name: Render animated contribution graph SVG
        run: bun scripts/generate_streak_svg.ts dirgaydtm contrib-heatmap.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
          branch: output-2
          create_branch: true
          push_options: "--force"
