name: Contrib Graph

"on":
  schedule:
    - cron: "0 * * * *" # every 1 hour
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Scrape real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: dirgaydtm
        run: bun scripts/fetch_contributions.ts dist/data/contributions.json

      - name: Render animated contribution graph SVG
        run: bun scripts/generate_streak_svg.ts dirgaydtm dist/contrib-heatmap.svg

      - name: Push only the output to output-2
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-2
          build_dir: dist
          commit_message: "chore: refresh contribution graph [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
