name: Tech Stack

"on":
  schedule:
    - cron: "10 * * * *" # every hour; the heap itself only changes daily (seeded by date)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies # matter-js
        run: bun install --frozen-lockfile

      - name: Generate tech stack SVG
        run: bun scripts/generate_stack.ts dist/stack.svg

      - name: Push only the output to output-5
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-5
          build_dir: dist
          commit_message: "chore: refresh tech stack [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
