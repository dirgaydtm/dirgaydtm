name: Chat Card

"on":
  schedule:
    - cron: "0 23 * * *" # 06:00 WIB
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Generate chat card SVG (no dependencies)
        run: bun scripts/generate_chat_card.ts dirgaydtm dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # higher API rate limit for the languages bubble

      - name: Push only the output to output-4
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-4
          build_dir: dist
          commit_message: "chore: refresh chat card [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
