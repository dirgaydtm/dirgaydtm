name: Generate ASCII Portrait

"on":
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate ASCII SVG
        run: bun scripts/render_ascii_portrait.ts data/Avatar.jpeg ascii-portrait.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ascii portrait [skip ci]"
          file_pattern: "ascii-portrait.svg"
          branch: output-3
          create_branch: true
          push_options: "--force"
