name: Generate ASCII Portrait

"on":
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate ASCII SVG
        run: mkdir -p dist && bun scripts/render_ascii_portrait.ts data/Avatar.jpeg dist/ascii-portrait.svg

      - name: Push only the output to output-3
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-3
          build_dir: dist
          commit_message: "chore: update ascii portrait [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
